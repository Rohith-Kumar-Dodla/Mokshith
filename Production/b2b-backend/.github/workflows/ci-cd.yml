name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint --if-present || echo "No lint script found"

      - name: Run tests
        run: npm test --if-present || echo "No test script found"
        env:
          MONGO_URI: mongodb://localhost:27017/test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-for-ci-minimum-64-characters-long-string-required
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-minimum-64-characters-long-string
          RAZORPAY_KEY_ID: test_razorpay_key_id
          RAZORPAY_KEY_SECRET: test_razorpay_secret
          RAZORPAY_WEBHOOK_SECRET: test_webhook_secret
          NODE_ENV: test

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          MONGO_URI: mongodb://localhost:27017/test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-for-ci-minimum-64-characters-long-string-required
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-minimum-64-characters-long-string
          RAZORPAY_KEY_ID: test_razorpay_key_id
          RAZORPAY_KEY_SECRET: test_razorpay_secret
          RAZORPAY_WEBHOOK_SECRET: test_webhook_secret
          NODE_ENV: test

      - name: Check coverage thresholds
        run: |
          node -e "
            const fs = require('fs');
            const coverageSummary = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
            const total = coverageSummary.total;
            
            console.log('\n📊 Coverage Summary:');
            console.log('Lines: ' + total.lines.pct + '%');
            console.log('Statements: ' + total.statements.pct + '%');
            console.log('Functions: ' + total.functions.pct + '%');
            console.log('Branches: ' + total.branches.pct + '%');
            
            const globalThreshold = 80;
            const criticalModules = {
              'payment': 90,
              'inventory': 90,
              'auth': 90
            };
            
            // Check global coverage
            const failed = [];
            if (total.lines.pct < globalThreshold) failed.push('lines');
            if (total.statements.pct < globalThreshold) failed.push('statements');
            if (total.functions.pct < globalThreshold) failed.push('functions');
            if (total.branches.pct < globalThreshold) failed.push('branches');
            
            if (failed.length > 0) {
              console.error('\n❌ Global coverage below 80%: ' + failed.join(', '));
              process.exit(1);
            }
            
            console.log('\n✅ All coverage thresholds met!');
          "
        if: success()

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: success()
        with:
          files: ./coverage/coverage-final.json,./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: true
          verbose: true

  build-and-push:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
